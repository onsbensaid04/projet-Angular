
<div class="container mt-4">

  <div class="mb-4">
    <label class="form-label fw-bold text-primary">
      Search Conference
    </label>

    <input
      type="text"
      name="search"
      class="form-control shadow-sm"
      placeholder="🔍 Search By Title"
      [(ngModel)]="searchTitle">
  </div>

  <h4 class="text-primary mb-3">{{ searchTitle }}</h4>

  @if (list.length == 0) {

    <div class="alert alert-info text-center">
      Aucune conférence disponible pour le moment.
    </div>

  }
  @else {

    <div class="row">

      @for (conf of list; track conf.title) {

        @if (searchTitle.trim() == '' ||
        conf.title.toLowerCase().includes(searchTitle.toLowerCase())) {

          <div class="col-md-4 mb-4">

            <app-conference-card
              [conf]="conf"
              (participateEvent)="participate($event)">
            </app-conference-card>

          </div>

        }

      }

    </div>

  }

</div>
